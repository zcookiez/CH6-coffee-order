spring:
  # ----------------------------------------------------
  # 1. H2 In-Memory DB 설정 (테스트 전용)
  # ----------------------------------------------------
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ----------------------------------------------------
  # 2. JPA 설정
  # ----------------------------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop # 테스트가 끝나면 스키마도 깔끔하게 삭제
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # ----------------------------------------------------
  # 3. Redis 설정 (동시성 락 테스트용 - 로컬 Redis 그대로 사용)
  # ----------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379

  # ----------------------------------------------------
  # 4. Kafka 설정 (더미 설정)
  # ----------------------------------------------------
  kafka:
    bootstrap-servers: localhost:9092
