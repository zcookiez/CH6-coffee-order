openapi: 3.0.1
info:
  title: Coffee Order System API
  description: 대용량 트래픽과 동시성을 고려한 커피 주문 시스템 API 명세서입니다.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: 포인트 API
  description: 사용자 포인트 충전 및 관리 API
- name: 메뉴 API
  description: 커피 메뉴 조회 및 인기 메뉴 랭킹 API
- name: 주문 API
  description: 커피 주문 및 결제 API
paths:
  /api/users/signup:
    post:
      tags:
      - user-controller
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponseUserResponse'
  /api/points/charge:
    post:
      tags:
      - 포인트 API
      summary: 포인트 충전
      description: 사용자의 포인트를 충전합니다. (동시성 제어 적용)
      operationId: chargePoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointChargeRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponsePointResponse'
  /api/orders:
    post:
      tags:
      - 주문 API
      summary: 커피 주문 및 결제
      description: 메뉴를 주문하고 포인트를 차감하여 결제합니다. (동시성 제어 적용)
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponseOrderResponse'
  /api/menus:
    get:
      tags:
      - 메뉴 API
      summary: 전체 메뉴 조회
      description: 현재 판매 중인 모든 커피 메뉴 목록을 조회합니다. (Redis 캐시 적용)
      operationId: getAllMenus
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponseListMenuResponse'
  /api/menus/popular:
    get:
      tags:
      - 메뉴 API
      summary: 인기 메뉴 Top 3 조회
      description: 최근 7일간 가장 많이 팔린 인기 메뉴 3개를 조회합니다. (캐시 및 장애 우회 적용)
      operationId: getPopularMenus
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponseListMenuResponse'
components:
  schemas:
    UserSignupRequest:
      required:
      - name
      type: object
      properties:
        name:
          type: string
    CommonResponseUserResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PointChargeRequest:
      required:
      - chargeRequestId
      - userId
      type: object
      properties:
        userId:
          type: integer
          description: 충전할 사용자 ID
          format: int64
          example: 1
        amount:
          type: integer
          description: 충전 금액 (0 초과)
          format: int64
          example: 10000
        chargeRequestId:
          type: string
          description: 충전 요청 고유 식별자 (멱등성 보장용 UUID)
          example: req-uuid-1234
      description: 포인트 충전 요청 DTO
    CommonResponsePointResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/PointResponse'
    PointResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
    OrderRequest:
      required:
      - menuId
      - userId
      type: object
      properties:
        userId:
          type: integer
          description: 주문하는 사용자 ID
          format: int64
          example: 1
        menuId:
          type: integer
          description: 주문할 메뉴 ID
          format: int64
          example: 2
        quantity:
          minimum: 1
          type: integer
          description: 주문 수량 (최소 1개 이상)
          format: int32
          example: 3
      description: 커피 주문 요청 DTO
    CommonResponseOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/OrderResponse'
    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        totalPrice:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - COMPLETED
          - CANCELED
          - FAILED
        createdAt:
          type: string
          format: date-time
    CommonResponseListMenuResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/MenuResponse'
    MenuResponse:
      type: object
      properties:
        id:
          type: integer
          description: 메뉴 ID
          format: int64
          example: 1
        name:
          type: string
          description: 메뉴명
          example: 아메리카노
        price:
          type: integer
          description: 가격
          format: int32
          example: 4500
        stock:
          type: integer
          description: 남은 재고
          format: int32
          example: 100
        status:
          type: string
          description: 메뉴 판매 상태
          example: ON_SALE
          enum:
          - ON_SALE
          - SOLD_OUT
          - DELETED
      description: 커피 메뉴 응답 DTO
